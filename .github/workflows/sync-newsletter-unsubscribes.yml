name: Sync Newsletter Unsubscribes

on:
  # Každý deň o 3:30 UTC. Kto sa odhlásil v Klaviyu, toho riadok zmaže z databázy webu
  # (zásady ochrany osobných údajov: výmaz do 30 dní po odvolaní súhlasu).
  schedule:
    - cron: '30 3 * * *'

  # Manuálne spustenie (GitHub Actions UI → Run workflow)
  workflow_dispatch:

jobs:
  sync:
    name: Zosúladiť odhlásenia newslettera s Klaviyom
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Edge Function
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Chýba secret SUPABASE_SECRET_KEY (tajný kľúč sb_secret_… zo Supabase → Project Settings → API Keys)."
            exit 1
          fi

          RESPONSE=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            -X POST \
            "https://xfkznvqufhnrphpdhfnc.supabase.co/functions/v1/sync-newsletter-unsubscribes" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP status: $RESPONSE"
          echo "Response:"
          cat /tmp/sync_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Synchronizácia zlyhala so statusom $RESPONSE"
            exit 1
          fi

          SUCCESS=$(python3 -c "import json; print(json.load(open('/tmp/sync_response.json')).get('success', False))")
          if [ "$SUCCESS" != "True" ]; then
            echo "❌ Synchronizácia vrátila success=false"
            exit 1
          fi
