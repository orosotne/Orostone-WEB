# Nastavenie nasadzovania edge funkcií (supabase functions deploy z koreňa repa).
# Funkcie, ktoré tu nie sú, sa nasadzujú s predvoleným verify_jwt = true.
project_id = "Orostone-WEB"

# Cron funkcie volá len GitHub Actions s tajným kľúčom sb_secret_… v hlavičke apikey.
# Nový kľúč nie je JWT, platforma ho nevie overiť, preto ho overuje funkcia sama
# (_shared/auth.ts isServiceRole proti SUPABASE_SECRET_KEYS) a všetko ostatné vráti 401.
[functions.send-daily-analytics]
verify_jwt = false

[functions.refresh-instagram-token]
verify_jwt = false

[functions.sync-newsletter-unsubscribes]
verify_jwt = false

# Interné funkcie: volajú ich len submit-quote a subscribe-newsletter s tajným kľúčom v hlavičke
# apikey, overenie rovnako cez _shared/auth.ts isServiceRole.
[functions.send-quote-notification]
verify_jwt = false

[functions.send-newsletter-welcome]
verify_jwt = false

# Verejné funkcie formulárov. Web posiela publishable kľúč sb_publishable_… len v hlavičke
# apikey (nie je to JWT); do vypnutia legacy kľúčov aj starý anon JWT. Kľúč netreba overovať,
# je verejný v kóde webu. Pred zápisom ich chráni Turnstile (TURNSTILE_ENFORCE) a odber
# newslettera aj strop na počet prihlásení.
[functions.submit-quote]
verify_jwt = false

[functions.subscribe-newsletter]
verify_jwt = false

# Verejné funkcie, už nasadené bez kontroly JWT. Uvedené tu, aby ich nasadenie bez
# --no-verify-jwt omylom neprepol na verify_jwt = true (build webu volá instagram-feed
# len s hlavičkou apikey).
[functions.instagram-feed]
verify_jwt = false

[functions.verify-turnstile]
verify_jwt = false

# Shopify webhook „Order payment“ (orders/paid): podpis X-Shopify-Hmac-Sha256 overuje funkcia sama
# (SHOPIFY_WEBHOOK_SECRET), Shopify nepošle JWT. Ručné preposlanie s tajným kľúčom (isServiceRole).
[functions.alfapureo-order]
verify_jwt = false

# Alfapureo posiela odkaz na sledovanie GLS; podpis overuje funkcia sama (ALFAPUREO_SECRET).
[functions.alfapureo-tracking]
verify_jwt = false

# Prehľad vzoriek: CRM posiela kľúč SAMPLE_STATUS_KEY (x-sample-status-key), ranná kontrola tajný
# kľúč sb_secret_… (apikey). Ani jeden nie je JWT, overuje ich funkcia sama.
[functions.sample-status]
verify_jwt = false
